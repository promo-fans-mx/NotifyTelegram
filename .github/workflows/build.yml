name: build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/Update-v${{ github.run_number }}.apk"
          cd dist && sha256sum *.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" dist/*.apk dist/SHA256.txt \
            --title "Update v${{ github.run_number }}" --latest \
            --notes "Tap the APK to install, then open the app and tap Notification access."
