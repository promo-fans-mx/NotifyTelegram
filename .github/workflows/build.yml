name: build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Versions
        run: |
          cat gradle/wrapper/gradle-wrapper.properties || true
          grep -rn "com.android" build.gradle.kts app/build.gradle.kts settings.gradle.kts 2>/dev/null || true
          grep -rn "minSdk\|compileSdk" app/build.gradle.kts 2>/dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/Update-v${{ github.run_number }}.apk"
          cd dist && sha256sum *.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" dist/*.apk dist/SHA256.txt \
            --title "Update v${{ github.run_number }}" --latest \
            --notes "Tap the APK to install, then open the app and tap Notification access."
