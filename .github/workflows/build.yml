name: build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Write diag.txt
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "== agp =="
            grep -rn "com.android" build.gradle.kts app/build.gradle.kts
            echo "== sdk =="
            grep -n "minSdk\|compileSdk\|targetSdk\|namespace\|viewBinding\|buildConfig" app/build.gradle.kts || echo none
            echo "== apk outputs =="
            find app/build/outputs -name "*.apk" 2>/dev/null || echo none
            echo "== build.log head =="
            grep -n "e: \|error:\|FAILURE\|What went wrong" -A 6 build.log 2>/dev/null | head -n 120 || echo none
            echo "== build.log tail =="
            tail -n 40 build.log 2>/dev/null || echo none
          } > diag.txt
          git add diag.txt
          git commit -m "diag [skip ci]" || true
          git push || true

      - name: Package
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "found: $APK"
          cp "$APK" "dist/Update-v${{ github.run_number }}.apk"
          cd dist && sha256sum *.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: apk
          path: dist/*

      - name: Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" dist/*.apk dist/SHA256.txt \
            --title "Update v${{ github.run_number }}" --latest \
            --notes "Tap the APK to install, then open the app and tap Notification access."
