name: build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build
        id: build
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Write diag.txt
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "== env =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "== wrapper dir =="
            ls -la gradle/wrapper || echo none
            echo "== wrapper props =="
            cat gradle/wrapper/gradle-wrapper.properties || echo none
            echo "== gradle.properties =="
            cat gradle.properties || echo none
            echo "== agp =="
            grep -rn "com.android" build.gradle.kts app/build.gradle.kts settings.gradle.kts gradle/libs.versions.toml 2>/dev/null || echo none
            echo "== sdk =="
            grep -n "minSdk\|compileSdk\|targetSdk\|namespace\|viewBinding\|buildConfig" app/build.gradle.kts || echo none
            echo "== signing =="
            grep -n "signingConfigs" -A 20 app/build.gradle.kts || echo none
            echo "== keystore =="
            ls -la keystore 2>/dev/null || echo none
            echo "== sources =="
            find app/src/main/java -name "*.kt" | sort || echo none
            echo "== build.log tail =="
            tail -n 150 build.log 2>/dev/null || echo none
          } > diag.txt
          git add diag.txt
          git commit -m "diag [skip ci]" || true
          git push || true

      - name: Package
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/Update-v${{ github.run_number }}.apk"
          cd dist && sha256sum *.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: apk
          path: dist/*

      - name: Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" dist/*.apk dist/SHA256.txt \
            --title "Update v${{ github.run_number }}" --latest \
            --notes "Tap the APK to install, then open the app and tap Notification access."
